name: Model installation regression
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  model-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_model_download.py -v
