name: Backend metadata regression
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install numpy==2.5.4 ai-edge-litert==2.3.0 fastapi==0.162.5 pillow==13.0.0
      - run: python -m unittest discover -s tests -p test_backend_model_info.py -v
      - run: python -m unittest discover -s tests -p test_runtime_requirements.py -v
      - name: Install API startup test dependencies
        run: pip install pydantic-settings uvicorn httpx2 python-multipart shapely sentry-sdk
      - name: Verify default readiness and lazy optional engines
        run: python -m unittest discover -s tests -p test_startup.py -v
