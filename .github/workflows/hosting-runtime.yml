name: Build pinned hosting runtime

on:
  push:
    branches: [main]
    paths:
      - k8s/local-hosting/**
      - .github/workflows/hosting-runtime.yml
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: k8s/local-hosting/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/opensensor/light-object-detect:hosting-${{ github.sha }}
