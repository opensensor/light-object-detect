name: Build and deploy hosting runtime

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - scripts/hosting_*.py
      - scripts/test_hosting_release.py
      - scripts/wait_hosting_release.py
      - .github/workflows/hosting-runtime.yml

permissions:
  contents: read
  packages: write
  statuses: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify release coordination
        run: python3 -m unittest discover -s scripts -p 'test_hosting_release.py' -v
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: build
        with:
          context: .
          file: k8s/local-hosting/Dockerfile
          build-args: |
            SENTRY_RELEASE=light-object-detect@${{ github.sha }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/opensensor/light-object-detect:hosting-${{ github.sha }}
      - name: Record this build's platform image
        if: steps.build.outcome == 'success'
        env:
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
        run: python3 scripts/hosting_release_manifest.py
      - uses: actions/upload-artifact@v4
        if: steps.build.outcome == 'success'
        with:
          name: hosting-release-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: hosting-release.json
          retention-days: 30
          if-no-files-found: error
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: runtime
    concurrency:
      group: detector-production-verification
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Verify this build is deployed to production and recovery
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/wait_hosting_release.py
