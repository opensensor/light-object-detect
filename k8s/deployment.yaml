apiVersion: apps/v1
kind: Deployment
metadata:
  name: light-object-detect
  namespace: light-object-detect
  labels:
    app.kubernetes.io/name: light-object-detect
    app.kubernetes.io/part-of: opensensor
spec:
  replicas: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: light-object-detect
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: light-object-detect
        app.kubernetes.io/part-of: opensensor
      annotations:
        hosting.opensensor.io/launcher-sha256: 5e3bfc417b37dc760fa2ac9b67e36067f32210a53024af8327f73f0cf6eb07f6
    spec:
      imagePullSecrets:
      - name: whitewhale
      containers:
      - name: light-object-detect
        image: ghcr.io/opensensor/light-object-detect@sha256:ce8010794ecd286f82bc2cbb44b7ece12169d122018fe26b7f96408a3efd8a1f
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8000
          protocol: TCP
        env:
        - name: LOG_LEVEL
          value: INFO
        - name: ONNX_MODEL_PATH
          value: backends/onnx/models/yolo26n.onnx
        - name: ONNX_MODEL_TYPE
          value: yolo26
        - name: HF_HOME
          value: /cache/huggingface
        - name: HF_HUB_OFFLINE
          value: '1'
        - name: HOME
          value: /tmp
        - name: USER
          value: hosting
        - name: TORCHINDUCTOR_CACHE_DIR
          value: /tmp/torch-inductor
        - name: TFLITE_MODEL_PATH
          value: /cache/huggingface/hosting-tflite/ssd_mobilenet_v1.tflite
        - name: TFLITE_LABELS_PATH
          value: /cache/huggingface/hosting-tflite/labelmap.txt
        volumeMounts:
        - name: hf-cache
          mountPath: /cache/huggingface
        - name: launcher
          mountPath: /hosting
          readOnly: true
        resources:
          requests:
            cpu: 1200m
            memory: 1500Mi
          limits:
            cpu: '2'
            memory: 4Gi
        startupProbe:
          httpGet:
            path: /__hosting/health
            port: 8000
          timeoutSeconds: 4
          periodSeconds: 5
          failureThreshold: 90
        readinessProbe:
          httpGet:
            path: /__hosting/health
            port: 8000
          timeoutSeconds: 4
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 60
          timeoutSeconds: 30
          failureThreshold: 5
        command:
        - python
        - -B
        - /hosting/launcher.py
      volumes:
      - name: hf-cache
        persistentVolumeClaim:
          claimName: huggingface-cache
      - name: launcher
        configMap:
          name: object-detection-launcher
      nodeSelector:
        opensensor.io/node-class: core
